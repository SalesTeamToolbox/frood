# public-guard CI backstop: scan pushed commits for secrets with a pinned gitleaks release.
# Template: copy to .github/workflows/secret-scan.yml. No third-party action (gitleaks-action
# needs a license for organisations); the binary is pinned by version and verified by sha256.
name: secret-scan

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.30.0"
  # sha256 of gitleaks_8.30.0_linux_x64.tar.gz (from the GitHub release asset digest)
  GITLEAKS_SHA256: "79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e"

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pinned gitleaks
        run: |
          set -euo pipefail
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          args=(git --no-banner --redact --ignore-gitleaks-allow --verbose)
          if [ -f .gitleaks.toml ]; then args+=(--config .gitleaks.toml); fi
          range=""
          if [ "$EVENT_NAME" = "push" ] \
             && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ] \
             && git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            range="${BEFORE_SHA}..${HEAD_SHA}"
          fi
          if [ -n "$range" ]; then
            echo "Scanning pushed range $range"
            gitleaks "${args[@]}" --log-opts="$range"
          else
            echo "Scanning full history"
            gitleaks "${args[@]}"
          fi
