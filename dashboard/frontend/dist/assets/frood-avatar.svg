<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Frood Avatar — Towel draped over bar, the essential hitchhiker's companion -->

  <!-- Circular background -->
  <circle cx="16" cy="16" r="15" fill="#1a1d27"/>

  <!-- Towel bar -->
  <line x1="6" y1="6" x2="26" y2="6" stroke="#E8A838" stroke-width="1.2" opacity="0.3"/>

  <!-- Towel draped over bar -->
  <path d="M8 6 
           Q9 6 9 8
           L9 23
           Q9 25 11 25
           L21 25
           Q23 25 23 23
           L23 8
           Q23 6 21 6
           Z" 
        fill="#1a1d27" 
        stroke="#E8A838" 
        stroke-width="1.2"/>

  <!-- Fold line -->
  <path d="M8 8 L24 8" 
        stroke="#E8A838" 
        stroke-width="0.8" 
        stroke-dasharray="2.5,1.5" 
        opacity="0.6"/>

  <!-- Weave texture -->
  <g stroke="#E8A838" stroke-width="0.4" opacity="0.5">
    <line x1="11" y1="12" x2="21" y2="12"/>
    <line x1="11" y1="15" x2="21" y2="15"/>
    <line x1="11" y1="18" x2="21" y2="18"/>
    <line x1="11" y1="21" x2="21" y2="21"/>
    <line x1="13" y1="8" x2="13" y2="23"/>
    <line x1="16" y1="8" x2="16" y2="23"/>
    <line x1="19" y1="8" x2="19" y2="23"/>
  </g>

  <!-- Hanging loop -->
  <path d="M13 6 Q13 3 16 3 Q19 3 19 6" 
        fill="none" 
        stroke="#E8A838" 
        stroke-width="1.3" 
        stroke-linecap="round"/>
</svg>