<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 56" fill="none">
  <!-- Frood Logo — Dark text variant -->
  <!-- "Frood" wordmark + towel icon -->

  <!-- "Frood" wordmark -->
  <text x="8" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="700" fill="#1a1d27" letter-spacing="-0.5">Frood</text>

  <!-- Subtle tagline -->
  <text x="8" y="51" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#8f98aa" letter-spacing="0.5">DON'T PANIC</text>

  <!-- Towel icon — towel draped over a bar with hanging loop -->
  <g transform="translate(148, 2)">
    <!-- Towel bar (subtle) -->
    <line x1="6" y1="6" x2="46" y2="6" stroke="#E8A838" stroke-width="1.5" opacity="0.3"/>

    <!-- Towel draped over bar -->
    <!-- Main towel body -->
    <path d="M8 6 
             Q10 6 10 10
             L10 36
             Q10 40 14 40
             L38 40
             Q42 40 42 36
             L42 10
             Q42 6 40 6
             Z" 
          fill="#f5f0e1" 
          stroke="#E8A838" 
          stroke-width="1.5"/>

    <!-- Fold line (towel folded over bar) -->
    <path d="M8 10 L42 10" 
          stroke="#E8A838" 
          stroke-width="1" 
          stroke-dasharray="4,3" 
          opacity="0.6"/>

    <!-- Towel texture/weave lines -->
    <g stroke="#E8A838" stroke-width="0.5" opacity="0.4">
      <!-- Horizontal weave lines -->
      <line x1="12" y1="16" x2="38" y2="16"/>
      <line x1="12" y1="20" x2="38" y2="20"/>
      <line x1="12" y1="24" x2="38" y2="24"/>
      <line x1="12" y1="28" x2="38" y2="28"/>
      <line x1="12" y1="32" x2="38" y2="32"/>
      <line x1="12" y1="36" x2="38" y2="36"/>
      <!-- Vertical weave lines -->
      <line x1="16" y1="12" x2="16" y2="36"/>
      <line x1="22" y1="12" x2="22" y2="36"/>
      <line x1="28" y1="12" x2="28" y2="36"/>
      <line x1="34" y1="12" x2="34" y2="36"/>
    </g>

    <!-- Hanging loop at top center -->
    <path d="M23 6 Q23 1 26 1 Q29 1 29 6" 
          fill="none" 
          stroke="#E8A838" 
          stroke-width="2" 
          stroke-linecap="round"/>

    <!-- Small "42" easter egg on towel corner -->
    <text x="38" y="38" font-family="monospace" font-size="5" fill="#E8A838" opacity="0.3">42</text>
  </g>
</svg>