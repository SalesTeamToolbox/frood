# Frood gitleaks config: defaults plus narrow allowlists for deliberate fake test literals.
# The guard reads this file from the REMOTE base of a push (and CI from the PR base branch), so a
# change here only takes effect after it has landed with a human's approval. Keep every entry
# justified below; never allowlist a whole directory of tests.
title = "frood"

[extend]
useDefault = true

# Exact fake literals found in unit tests (rule generic-api-key only, matched against the secret
# value and anchored). A real key of any provider shape, or any other generic-looking value in
# tests/, is still reported.
#   n8n_api_testkey123, test-key-abc123         tests/test_n8n_create_tool.py, test_n8n_tool.py
#   test-abacus-key-12345, abacus-key-12345     tests/test_abacus_provider.py
#   test-secret-key-at-least-32-chars-long,
#   correct-secret-key-32-chars-long            tests/test_encryption.py
#   test-secret-32-chars-long-ok-yep            tests/test_security.py, test_device_auth.py
#   ghp_DUPLICATE1234567890A                    tests/test_github_accounts.py (not a real token)
#   sk-1234567890abcdef                         tests/test_ssh_tool.py (redaction fixture)
#   my_api_key_12345                            tests/test_advanced_tools.py
[[allowlists]]
description = "specific fake literals in unit tests"
targetRules = ["generic-api-key"]
regexes = [
  '''^(?:n8n_api_testkey123|test-key-abc123|test-abacus-key-12345|abacus-key-12345)$''',
  '''^(?:test-secret-key-at-least-32-chars-long|correct-secret-key-32-chars-long)$''',
  '''^(?:test-secret-32-chars-long-ok-yep|ghp_DUPLICATE1234567890A|sk-1234567890abcdef|my_api_key_12345)$''',
]

# Minified third-party bundles (xterm, monaco) trip generic-api-key on identifiers like
# "KeybindingResolver=" and "g.token,N=". They hold no secrets.
[[allowlists]]
description = "minified vendor bundles in dashboard/frontend/dist"
targetRules = ["generic-api-key"]
paths = ['''^dashboard/frontend/dist/''']
