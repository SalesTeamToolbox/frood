# Public website for Frood AI agent platform — static HTML/CSS, no backend
#
# NOTE: 443 belongs to the stream{} SNI router in /etc/nginx/nginx.conf
# which proxies to 127.0.0.1:4443 with PROXY protocol. Every https server
# block here listens on 127.0.0.1:4443 ssl proxy_protocol — NEVER 443 ssl.

# HTTP -> HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name frood.salesteamtoolbox.com;
    return 301 https://$server_name$request_uri;
}

# HTTPS — public static website (no backend)
server {
    listen 127.0.0.1:4443 ssl proxy_protocol;
    server_name frood.salesteamtoolbox.com;
    absolute_redirect off;

    ssl_certificate     /etc/letsencrypt/live/frood.salesteamtoolbox.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/frood.salesteamtoolbox.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/salesteamtoolbox.com/frood.salesteamtoolbox.com;
    index index.html;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Cache static assets
    location ~* \.(png|jpg|jpeg|webp|svg|woff2?|ico|css|js)$ {
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Serve static files
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Block dotfiles
    location ~ /\.(?!well-known) {
        return 404;
    }
}