<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | default: "Frood — AI Agent Platform" }} | DON'T PANIC</title>
  <link rel="icon" type="image/svg+xml" href="{{ '/assets/frood-favicon.svg' | relative_url }}">
  <link rel="apple-touch-icon" href="{{ '/assets/icons/apple-touch-icon-180.png' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <style>
    :root {
      --towel-gold: #E8A838;
      --towel-gold-dark: #D4922A;
      --space-dark: #1a1d27;
      --space-medium: #2a2f3a;
      --space-light: #e8eaf0;
      --panic-red: #d63031;
      --improbability-blue: #0984e3;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif; background: var(--space-dark); color: var(--space-light); line-height: 1.6; }
    .container { max-width: 900px; margin: 0 auto; padding: 0 24px; }
    .site-header { padding: 24px 0; border-bottom: 1px solid rgba(255,255,255,0.1); }
    .nav { display: flex; justify-content: space-between; align-items: center; }
    .brand { display: flex; align-items: center; gap: 12px; text-decoration: none; color: var(--space-light); font-weight: 700; font-size: 1.5rem; }
    .brand svg { width: 40px; height: 40px; }
    .brand .tagline { font-size: 0.65rem; color: var(--towel-gold); font-weight: 600; letter-spacing: 0.5px; margin-top: -4px; display: block; }
    .nav-cta { background: var(--towel-gold); color: var(--space-dark); padding: 10px 20px; border-radius: 6px; text-decoration: none; font-weight: 600; transition: background 0.2s; }
    .nav-cta:hover { background: var(--towel-gold-dark); }
    .content { padding: 40px 0 60px; }
    h1, h2, h3 { color: var(--space-light); }
    h1 { font-size: 2.5rem; margin-bottom: 1rem; }
    h2 { font-size: 1.75rem; margin: 2rem 0 1rem; padding-bottom: 0.5rem; border-bottom: 1px solid rgba(255,255,255,0.1); }
    h3 { font-size: 1.25rem; margin: 1.5rem 0 0.75rem; }
    a { color: var(--towel-gold); text-decoration: none; }
    a:hover { color: var(--towel-gold-dark); text-decoration: underline; }
    code { background: var(--space-medium); padding: 0.2em 0.4em; border-radius: 4px; font-family: monospace; font-size: 0.9em; }
    pre { background: var(--space-medium); padding: 1rem; border-radius: 8px; overflow-x: auto; }
    pre code { background: transparent; padding: 0; }
    table { width: 100%; border-collapse: collapse; margin: 1.5rem 0; }
    th, td { padding: 0.75rem; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.1); }
    th { color: var(--towel-gold); font-weight: 600; }
    tr:hover td { background: rgba(255,255,255,0.03); }
    .site-footer { padding: 40px 0; border-top: 1px solid rgba(255,255,255,0.1); text-align: center; color: rgba(255,255,255,0.5); font-size: 0.9rem; }
    .site-footer a { color: var(--towel-gold); }
    .btn { display: inline-flex; align-items: center; gap: 8px; padding: 12px 24px; border-radius: 8px; font-weight: 600; text-decoration: none; transition: transform 0.2s, box-shadow 0.2s; margin: 0 8px 8px 0; }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.3); }
    .btn-primary { background: var(--towel-gold); color: var(--space-dark); border: none; }
    .btn-primary:hover { background: var(--towel-gold-dark); }
    .btn-outline { background: transparent; color: var(--towel-gold); border: 2px solid var(--towel-gold); }
    .btn-outline:hover { background: var(--towel-gold); color: var(--space-dark); }
  </style>
</head>
<body>
  <header class="site-header">
    <nav class="nav container">
      <a class="brand" href="{{ '/' | relative_url }}">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><rect width="32" height="32" rx="7" fill="#E8A838"/><rect x="7" y="8" width="18" height="16" rx="3" fill="#fff" fill-opacity="0.25" stroke="#fff" stroke-width="1.8"/><line x1="16" y1="8" x2="16" y2="24" stroke="#fff" stroke-width="1.5" stroke-dasharray="2.5,1.5"/><line x1="9" y1="13" x2="14" y2="13" stroke="#fff" stroke-width="1.2" opacity="0.6"/><line x1="9" y1="17" x2="14" y2="17" stroke="#fff" stroke-width="1.2" opacity="0.6"/><line x1="18" y1="13" x2="23" y2="13" stroke="#fff" stroke-width="1.2" opacity="0.6"/><line x1="18" y1="17" x2="23" y2="17" stroke="#fff" stroke-width="1.2" opacity="0.6"/><path d="M13 8 Q13 3.5 16 3.5 Q19 3.5 19 8" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>
        <span>Frood<span class="tagline">DON'T PANIC</span></span>
      </a>
      <a class="nav-cta" href="https://salesteamtoolbox.com/?utm_source=github&utm_medium=frood&utm_campaign=oss">Try Frood on Sales Team Toolbox</a>
    </nav>
  </header>

  <main class="content container">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; 2026 Sales Team Toolbox. MIT License.</p>
      <p><a href="{{ '/docs/installation.html' | relative_url }}">📖 Docs → Installation</a> · <a href="https://github.com/SalesTeamToolbox/frood">🐙 GitHub</a> · <a href="https://salesteamtoolbox.com/docs/frood">🌐 Full Documentation</a></p>
      <p class="easter-egg">🛸 42 • DON'T PANIC • 🛸</p>
    </div>
  </footer>
</body>
</html>
