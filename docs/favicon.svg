<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Frood Favicon — Towel draped over bar, the essential hitchhiker's companion -->

  <!-- Towel bar -->
  <line x1="4" y1="5" x2="28" y2="5" stroke="#E8A838" stroke-width="1.5" opacity="0.3"/>

  <!-- Towel draped over bar -->
  <path d="M6 5 
           Q7 5 7 7
           L7 25
           Q7 27 9 27
           L23 27
           Q25 27 25 25
           L25 7
           Q25 5 23 5
           Z" 
        fill="#1a1d27" 
        stroke="#E8A838" 
        stroke-width="1.5"/>

  <!-- Fold line -->
  <path d="M6 7 L26 7" 
        stroke="#E8A838" 
        stroke-width="0.8" 
        stroke-dasharray="3,2" 
        opacity="0.6"/>

  <!-- Weave texture -->
  <g stroke="#E8A838" stroke-width="0.4" opacity="0.5">
    <line x1="10" y1="11" x2="22" y2="11"/>
    <line x1="10" y1="14" x2="22" y2="14"/>
    <line x1="10" y1="17" x2="22" y2="17"/>
    <line x1="10" y1="20" x2="22" y2="20"/>
    <line x1="10" y1="23" x2="22" y2="23"/>
    <line x1="12" y1="7" x2="12" y2="25"/>
    <line x1="16" y1="7" x2="16" y2="25"/>
    <line x1="20" y1="7" x2="20" y2="25"/>
  </g>

  <!-- Hanging loop -->
  <path d="M13 5 Q13 2 16 2 Q19 2 19 5" 
        fill="none" 
        stroke="#E8A838" 
        stroke-width="1.5" 
        stroke-linecap="round"/>

  <!-- 42 easter egg -->
  <text x="22" y="25" font-family="monospace" font-size="3" fill="#E8A838" opacity="0.25">42</text>
</svg>